[colors.bright]
black = "0x6D7070"
blue = "0x1BA6FA"
cyan = "0x73FBF1"
green = "0xB8E466"
magenta = "0xA578EA"
red = "0xFF4352"
white = "0xFEFEF8"
yellow = "0xFFD750"

[colors.cursor]
cursor = "0xFF261E"
text = "0x292C3E"

[colors.normal]
black = "0x0d0d0d"
blue = "0x1BA6FA"
cyan = "0x21DEEF"
green = "0xA0E521"
magenta = "0x8763B8"
red = "0xFF301B"
white = "0xEBEBEB"
yellow = "0xFFC620"

[colors.primary]
background = "0x292C3E"
foreground = "0xEBEBEB"

[cursor]
style = "Beam"
vi_mode_style = "Block"

[font]
size = 15

[font.bold]
family = "FiraCode Nerd Font"
style = "Bold"

[font.italic]
family = "FiraCode Nerd Font"
style = "Italic"

[font.normal]
family = "FiraCode Nerd Font"
style = "Regular"

[mouse]
hide_when_typing = true

[window]
title = "terminal"
decorations = "Buttonless"

[terminal.shell]
program = "/opt/homebrew/bin/bash"
args = ["--login"]

[[keyboard.bindings]]
action = "SpawnNewInstance"
key = "Return"
mods = "Control"

[[keyboard.bindings]]
action = "ScrollPageUp"
key = "PageUp"

[[keyboard.bindings]]
action = "ScrollPageDown"
key = "PageDown"

[[keyboard.bindings]]
key = "L"
mods = "Command"
chars = "\f"

[[keyboard.bindings]]
key = "A"
mods = "Command"
chars = "\x01"

[[keyboard.bindings]]
key = "E"
mods = "Command"
chars = "\x05"

[[keyboard.bindings]]
key = "U"
mods = "Command"
chars = "\x15"

[[keyboard.bindings]]
key = "K"
mods = "Command"
chars = "\x0b"

[[keyboard.bindings]]
key = "W"
mods = "Command"
chars = "\x17"

[[keyboard.bindings]]
key = "R"
mods = "Command"
chars = "\x12"

[[keyboard.bindings]]
key = "C"
mods = "Command"
chars = "\x03"

[[keyboard.bindings]]
key = "V"
mods = "Command"
action = "ReceiveChar"

[[keyboard.bindings]]
key = "C"
mods = "Command|Shift"
action = "Copy"

[[keyboard.bindings]]
key = "V"
mods = "Command|Shift"
action = "Paste"
