# Enable tiling by default
default-root-container-layout = 'tiles'
default-root-container-orientation = 'auto'

# Start at login
start-at-login = true
after-login-command = []
after-startup-command = []

[mode.main.binding]
# Focus windows
alt-h = 'focus left'
alt-j = 'focus down'
alt-k = 'focus up'
alt-l = 'focus right'
alt-q = 'close'

# Move windows
alt-ctrl-h = 'move left'
alt-ctrl-j = 'move down'
alt-ctrl-k = 'move up'
alt-ctrl-l = 'move right'

# Resize
alt-minus = 'resize smart -50'
alt-equal = 'resize smart +50'

# Workspaces
alt-1 = 'workspace 1'
alt-2 = 'workspace 2'
alt-3 = 'workspace 3'
alt-4 = 'workspace 4'
alt-5 = 'workspace 5'
alt-6 = 'workspace 6'

# Move window to workspace
alt-ctrl-1 = 'move-node-to-workspace 1'
alt-ctrl-2 = 'move-node-to-workspace 2'
alt-ctrl-3 = 'move-node-to-workspace 3'
alt-ctrl-4 = 'move-node-to-workspace 4'
alt-ctrl-5 = 'move-node-to-workspace 5'
alt-ctrl-6 = 'move-node-to-workspace 6'

# Layout
alt-f = 'layout floating tiling'        # toggle floating/tiling
alt-t = 'layout tiles horizontal vertical'
alt-s = 'layout accordion horizontal vertical'

# Fullscreen
alt-m = 'fullscreen'

# Reload config
alt-ctrl-r = 'reload-config'

alt-enter = 'exec-and-forget open -n -a Alacritty'

[gaps]
inner.horizontal = 0
inner.vertical   = 0
outer.left       = 0
outer.right      = 0
outer.top        = 0
outer.bottom     = 0
