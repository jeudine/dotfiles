# Enable tiling by default
default-root-container-layout = 'tiles'
default-root-container-orientation = 'auto'

# Start at login
start-at-login = true
after-login-command = []
after-startup-command = []

[mode.main.binding]
# Focus windows
cmd-h = 'focus left'
cmd-j = 'focus down'
cmd-k = 'focus up'
cmd-l = 'focus right'

# Move windows
cmd-shift-h = 'move left'
cmd-shift-j = 'move down'
cmd-shift-k = 'move up'
cmd-shift-l = 'move right'

# Resize
cmd-minus = 'resize smart -50'
cmd-equal = 'resize smart +50'

# Workspaces
cmd-1 = 'workspace 1'
cmd-2 = 'workspace 2'
cmd-3 = 'workspace 3'
cmd-4 = 'workspace 4'
cmd-5 = 'workspace 5'
cmd-6 = 'workspace 6'

# Move window to workspace
cmd-shift-1 = 'move-node-to-workspace 1'
cmd-shift-2 = 'move-node-to-workspace 2'
cmd-shift-3 = 'move-node-to-workspace 3'
cmd-shift-4 = 'move-node-to-workspace 4'
cmd-shift-5 = 'move-node-to-workspace 5'
cmd-shift-6 = 'move-node-to-workspace 6'

# Layout
cmd-shift-f = 'layout floating tiling'        # toggle floating/tiling
cmd-shift-t = 'layout tiles horizontal vertical'
cmd-shift-s = 'layout accordion horizontal vertical'

# Fullscreen
cmd-shift-m = 'fullscreen'

# Reload config
cmd-shift-r = 'reload-config'

cmd-enter = 'exec-and-forget open -n -a Alacritty'

[gaps]
inner.horizontal = 0
inner.vertical   = 0
outer.left       = 0
outer.right      = 0
outer.top        = 0
outer.bottom     = 0
